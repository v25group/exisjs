<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExisJS | WebSockets Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f172a;
        --surface: rgba(30, 41, 59, 0.7);
        --border: rgba(255, 255, 255, 0.1);
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --text: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(
            circle at 15% 50%,
            rgba(59, 130, 246, 0.15),
            transparent 25%
          ),
          radial-gradient(
            circle at 85% 30%,
            rgba(139, 92, 246, 0.15),
            transparent 25%
          );
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        width: 100%;
        max-width: 900px;
        height: 85vh;
        display: flex;
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .sidebar {
        width: 280px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: rgba(15, 23, 42, 0.4);
      }

      .header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
      }

      .header h2 {
        font-weight: 600;
        font-size: 1.25rem;
        background: linear-gradient(to right, #60a5fa, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .rooms {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      .room {
        padding: 12px 16px;
        border-radius: 12px;
        margin-bottom: 8px;
        cursor: pointer;
        color: var(--text-muted);
        transition: all 0.2s ease;
        font-weight: 500;
      }

      .room:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text);
      }

      .room.active {
        background: var(--primary);
        color: white;
      }

      .chat-area {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-header h3 {
        font-weight: 500;
      }

      .status {
        font-size: 0.875rem;
        color: #10b981;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #10b981;
        border-radius: 50%;
        box-shadow: 0 0 10px #10b981;
      }

      .status.disconnected {
        color: #ef4444;
      }
      .status.disconnected::before {
        background: #ef4444;
        box-shadow: 0 0 10px #ef4444;
      }

      .messages {
        flex: 1;
        padding: 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        max-width: 70%;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .message.received {
        align-self: flex-start;
      }

      .message.sent {
        align-self: flex-end;
      }

      .message-bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.95rem;
        line-height: 1.5;
      }

      .message.received .message-bubble {
        background: rgba(255, 255, 255, 0.1);
        border-bottom-left-radius: 4px;
      }

      .message.sent .message-bubble {
        background: var(--primary);
        border-bottom-right-radius: 4px;
      }

      .message-meta {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-left: 4px;
      }

      .system-message {
        align-self: center;
        background: rgba(255, 255, 255, 0.05);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .input-area {
        padding: 24px;
        border-top: 1px solid var(--border);
      }

      form {
        display: flex;
        gap: 12px;
      }

      input {
        flex: 1;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border);
        padding: 14px 20px;
        border-radius: 12px;
        color: white;
        font-family: inherit;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      input:focus {
        border-color: var(--primary);
      }

      button {
        background: var(--primary);
        color: white;
        border: none;
        padding: 0 24px;
        border-radius: 12px;
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: var(--primary-hover);
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <div class="header">
          <h2>Exis Chat</h2>
        </div>
        <div class="rooms" id="roomsList">
          <div class="room active" data-room="general"># general</div>
          <div class="room" data-room="random"># random</div>
          <div class="room" data-room="help"># help</div>
        </div>
      </div>

      <div class="chat-area">
        <div class="chat-header">
          <h3 id="currentRoomTitle"># general</h3>
          <div class="status" id="connStatus">Connected</div>
        </div>

        <div class="messages" id="messagesBox">
          <div class="system-message">Welcome to Exis WebSockets!</div>
        </div>

        <div class="input-area">
          <form id="chatForm">
            <input
              type="text"
              id="msgInput"
              placeholder="Message #general..."
              autocomplete="off"
            />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <script>
      let ws
      let currentRoom = 'general'
      const userId = 'user_' + Math.floor(Math.random() * 10000)

      const messagesBox = document.getElementById('messagesBox')
      const connStatus = document.getElementById('connStatus')
      const roomsList = document.getElementById('roomsList')
      const currentRoomTitle = document.getElementById('currentRoomTitle')
      const chatForm = document.getElementById('chatForm')
      const msgInput = document.getElementById('msgInput')

      function connect() {
        // Connect to the Exis WebSocket route
        ws = new WebSocket(`ws://${window.location.host}/ws`)

        ws.onopen = () => {
          connStatus.textContent = 'Connected'
          connStatus.className = 'status'

          // Join initial room
          ws.send(
            JSON.stringify({
              action: 'join',
              room: currentRoom,
              userId,
            })
          )
        }

        ws.onmessage = (event) => {
          const rawData = JSON.parse(event.data);
          const eventName = rawData.event;
          const data = rawData.data || rawData; // Support both { event, data } and raw { type }

          if (eventName === 'room:join') {
            addSystemMessage(`${data.data.userId || data.id} auto-joined #${data.room}`);
          } else if (eventName === 'room:leave') {
            addSystemMessage(`${data.data.userId || data.id} auto-left #${data.room}`);
          } else if (eventName === 'roster') {
            addSystemMessage(`Online Users: ${data.roster.map((r) => r.data.userId || r.id).join(', ')}`);
          } else if (data.type === 'system') {
            addSystemMessage(data.message);
          } else if (data.type === 'chat') {
            addChatMessage(data.message, data.userId === userId ? 'sent' : 'received', data.userId);
          }
        };

        ws.onclose = () => {
          connStatus.textContent = 'Disconnected'
          connStatus.className = 'status disconnected'
          setTimeout(connect, 2000) // Auto reconnect
        }
      }

      // UI Helpers
      function addSystemMessage(text) {
        const el = document.createElement('div')
        el.className = 'system-message'
        el.textContent = text
        messagesBox.appendChild(el)
        messagesBox.scrollTop = messagesBox.scrollHeight
      }

      function addChatMessage(text, type, sender) {
        const wrapper = document.createElement('div')
        wrapper.className = `message ${type}`

        const meta = document.createElement('div')
        meta.className = 'message-meta'
        meta.textContent = type === 'sent' ? 'You' : sender

        const bubble = document.createElement('div')
        bubble.className = 'message-bubble'
        bubble.textContent = text

        wrapper.appendChild(meta)
        wrapper.appendChild(bubble)
        messagesBox.appendChild(wrapper)
        messagesBox.scrollTop = messagesBox.scrollHeight
      }

      // Event Listeners
      roomsList.addEventListener('click', (e) => {
        const roomEl = e.target.closest('.room')
        if (!roomEl) return

        const newRoom = roomEl.dataset.room
        if (newRoom === currentRoom) return

        // Update UI
        document
          .querySelectorAll('.room')
          .forEach((r) => r.classList.remove('active'))
        roomEl.classList.add('active')
        currentRoom = newRoom
        currentRoomTitle.textContent = `# ${newRoom}`
        msgInput.placeholder = `Message #${newRoom}...`

        // Clear messages
        messagesBox.innerHTML = ''

        // Send join event
        ws.send(
          JSON.stringify({
            action: 'join',
            room: currentRoom,
            userId,
          })
        )
      })

      chatForm.addEventListener('submit', (e) => {
        e.preventDefault()
        const text = msgInput.value.trim()
        if (!text || ws.readyState !== WebSocket.OPEN) return

        // Send message
        ws.send(
          JSON.stringify({
            action: 'message',
            room: currentRoom,
            userId,
            message: text,
          })
        )

        msgInput.value = ''
      })

      // Boot
      connect()
    </script>
  </body>
</html>
