[package]
edition = "2021"
name = "exisjs-rs"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.21"
hmac = "0.12"
napi = { version = "2.16.14", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6.1"

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
lto = true
strip = "symbols"
