name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm install

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # Build first: the benchmark sources import the compiled exisjs package
      - name: Build
        run: npm run build

      - name: Typecheck (sources, tests, bench)
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      # B8: a production install must stay small and free of build tooling
      - name: Production install size budget
        run: node scripts/size-budget.mjs

      - name: Package checks (exports and types)
        run: |
          npx --yes publint@0.3 packages/exisjs
          npx --yes publint@0.3 packages/cli
          npx --yes @arethetypeswrong/cli@0.18 --pack packages/exisjs
          npx --yes @arethetypeswrong/cli@0.18 --pack packages/cli

  examples:
    name: Examples and scaffold
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Type-checks, tests, builds and boots each example in production mode,
      # then does the same for freshly scaffolded projects
      - name: Verify examples and create-exisjs output
        run: npm run verify:examples
