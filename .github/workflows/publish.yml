name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Lets npm sign a provenance statement for each published package
  id-token: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # npm ci installs exactly the lockfile: a package published after the
      # last review can't reach a release
      - name: Install Dependencies
        run: npm ci

      - name: Build Workspace
        run: npm run build

      - name: Run Tests
        run: npm run test

      # A prerelease must never move `latest` (docs/RELEASING.md): the npm
      # tag comes from the version, -alpha -> alpha, -beta -> beta, -rc -> next
      - name: Choose the npm tag
        run: |
          VERSION=$(node -p "require('./packages/exisjs/package.json').version")
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*) TAG=beta ;;
            *-rc*) TAG=next ;;
            *-canary*) TAG=canary ;;
            *-*) echo "Unknown prerelease $VERSION"; exit 1 ;;
            *) TAG=latest ;;
          esac
          echo "Publishing $VERSION with tag $TAG"
          echo "NPM_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Publish @exisjs/cli
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          EXISTS=$(npm view @exisjs/cli@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/cli --access public --provenance --tag "$NPM_TAG"
          else
            echo "@exisjs/cli@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish exisjs
        run: |
          VERSION=$(node -p "require('./packages/exisjs/package.json').version")
          EXISTS=$(npm view exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/exisjs --access public --provenance --tag "$NPM_TAG"
          else
            echo "exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-exisjs
        run: |
          VERSION=$(node -p "require('./packages/create/package.json').version")
          EXISTS=$(npm view create-exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/create --access public --provenance --tag "$NPM_TAG"
          else
            echo "create-exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/fetch
        run: |
          VERSION=$(node -p "require('./packages/fetch/package.json').version")
          EXISTS=$(npm view @exisjs/fetch@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/fetch --access public --provenance --tag "$NPM_TAG"
          else
            echo "@exisjs/fetch@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve Release Notes
        id: release_notes
        shell: bash
        # Through env: a tag name inside the script could run as shell code
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NOTE_FILE=$(find changelog -type f -name "${TAG}.md" 2>/dev/null | head -n 1)
          # v0.10.0-alpha.0 uses the notes of v0.10.0
          if [ -z "$NOTE_FILE" ]; then
            NOTE_FILE=$(find changelog -type f -name "${TAG%%-*}.md" 2>/dev/null | head -n 1)
          fi
          if [ -n "$NOTE_FILE" ] && [ -f "$NOTE_FILE" ]; then
            echo "Found release notes at $NOTE_FILE"
            echo "path=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No custom release notes file found for $TAG"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ env.NPM_TAG != 'latest' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

