name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Publish exisjs
        run: |
          VERSION=$(node -p "require('./packages/exisjs/package.json').version")
          EXISTS=$(npm view exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/exisjs --access public
          else
            echo "exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/create
        run: |
          VERSION=$(node -p "require('./packages/create/package.json').version")
          EXISTS=$(npm view @exisjs/create@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/create --access public
          else
            echo "@exisjs/create@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/client
        run: |
          VERSION=$(node -p "require('./packages/client/package.json').version")
          EXISTS=$(npm view @exisjs/client@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/client --access public
          else
            echo "@exisjs/client@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
