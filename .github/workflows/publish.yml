name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-native:
    name: Build Native (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - name: Install Dependencies
        run: npm install
      - name: Setup Zig
        if: ${{ matrix.settings.target == 'aarch64-unknown-linux-musl' || matrix.settings.target == 'aarch64-pc-windows-msvc' }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build Native
        working-directory: packages/rs
        shell: bash
        run: |
          if [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            npx napi build --platform --release --target ${{ matrix.settings.target }} --use-napi-cross
          elif [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-musl" ]]; then
            npx napi build --platform --release --target ${{ matrix.settings.target }} --cross-compile
          elif [[ "${{ matrix.settings.target }}" == "aarch64-pc-windows-msvc" ]]; then
            npx napi build --platform --release --target ${{ matrix.settings.target }} --cross-compile
          else
            npx napi build --platform --release --target ${{ matrix.settings.target }}
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/rs/*.node
          if-no-files-found: error

  publish:
    name: Publish Packages
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Download Native Artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages/rs/artifacts
          merge-multiple: true

      - name: Setup Native NPM Packages
        working-directory: packages/rs
        run: |
          npx napi create-npm-dirs
          cp artifacts/*.node ./
          npx napi prepublish -t npm

      - name: Build Workspace
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Publish exisjs
        run: |
          VERSION=$(node -p "require('./packages/exisjs/package.json').version")
          EXISTS=$(npm view exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/exisjs --access public
          else
            echo "exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/rs
        run: |
          VERSION=$(node -p "require('./packages/rs/package.json').version")
          EXISTS=$(npm view @exisjs/rs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/rs --access public
          else
            echo "@exisjs/rs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/create
        run: |
          VERSION=$(node -p "require('./packages/create/package.json').version")
          EXISTS=$(npm view @exisjs/create@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/create --access public
          else
            echo "@exisjs/create@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/fetch
        run: |
          VERSION=$(node -p "require('./packages/fetch/package.json').version")
          EXISTS=$(npm view @exisjs/fetch@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/fetch --access public
          else
            echo "@exisjs/fetch@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/telemetry
        run: |
          VERSION=$(node -p "require('./packages/telemetry/package.json').version")
          EXISTS=$(npm view @exisjs/telemetry@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/telemetry --access public
          else
            echo "@exisjs/telemetry@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
