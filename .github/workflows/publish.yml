name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build Workspace
        run: npm run build

      - name: Run Tests
        run: npm run test

      - name: Publish exisjs
        run: |
          VERSION=$(node -p "require('./packages/exisjs/package.json').version")
          EXISTS=$(npm view exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/exisjs --access public
          else
            echo "exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-exisjs
        run: |
          VERSION=$(node -p "require('./packages/create/package.json').version")
          EXISTS=$(npm view create-exisjs@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/create --access public
          else
            echo "create-exisjs@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/fetch
        run: |
          VERSION=$(node -p "require('./packages/fetch/package.json').version")
          EXISTS=$(npm view @exisjs/fetch@$VERSION version 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            npm publish --workspace=packages/fetch --access public
          else
            echo "@exisjs/fetch@$VERSION is already published. Skipping."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve Release Notes
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          NOTE_FILE=$(find changelog -type f -name "${TAG}.md" 2>/dev/null | head -n 1)
          if [ -n "$NOTE_FILE" ] && [ -f "$NOTE_FILE" ]; then
            echo "Found release notes at $NOTE_FILE"
            echo "path=$NOTE_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No custom release notes file found for $TAG"
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

