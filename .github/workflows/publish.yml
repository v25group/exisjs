name: Publish

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          always-auth: false

      - name: Install Dependencies
        run: |
          npm install



      - name: Build
        run: npm run build

      - name: Publish exisjs
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/exis/package.json').version")
          npm view exisjs@$PACKAGE_VERSION version 2>/dev/null && echo "exisjs@$PACKAGE_VERSION already published, skipping" || npm publish --workspace=packages/exis --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/create
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/create-exis/package.json').version")
          npm view @exisjs/create@$PACKAGE_VERSION version 2>/dev/null && echo "@exisjs/create@$PACKAGE_VERSION already published, skipping" || npm publish --workspace=packages/create-exis --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @exisjs/client
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/client/package.json').version")
          npm view @exisjs/client@$PACKAGE_VERSION version 2>/dev/null && echo "@exisjs/client@$PACKAGE_VERSION already published, skipping" || npm publish --workspace=packages/client --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
