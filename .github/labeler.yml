# These rules configure the PR labeler workflow
# Map labels to path patterns

"area: cli":
  - changed-files:
    - any-glob-to-any-file: 'packages/cli/**/*'
    - any-glob-to-any-file: 'packages/create/**/*'

"area: core":
  - changed-files:
    - any-glob-to-any-file: 'packages/exisjs/src/server/**/*'
    - any-glob-to-any-file: 'packages/exisjs/src/router/**/*'
    
"area: middleware":
  - changed-files:
    - any-glob-to-any-file: 'packages/exisjs/src/middleware/**/*'

"area: docs":
  - changed-files:
    - any-glob-to-any-file: 'docs/**/*'
    - any-glob-to-any-file: 'README.md'

"area: github-actions":
  - changed-files:
    - any-glob-to-any-file: '.github/**/*'
